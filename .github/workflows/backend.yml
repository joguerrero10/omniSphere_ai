name: Backend CI/CD

on:
  push:
    paths:
      - "backend/**"
    branches:
      - main
      - dev
      - '**'
  pull_request:
    branches:
      - main
      - dev
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install deps
        run: cd backend && npm install

      # - name: Run tests
      #   run: cd backend && npm test

      - name: Build
        run: cd backend && npm run build