name: Backend CI

on:
  push:
    paths:
      - "backend/**"
    branches:
      - main
      - dev
  pull_request:
    paths:
      - "backend/**"
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: cd backend && npm ci

      - name: Build
        run: cd backend && npm run build

      - name: Test
        run: cd backend && npm test
